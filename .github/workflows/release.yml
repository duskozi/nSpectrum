name: Release

# Builds and publishes nSpectrum (no test project).
# Runs when you push a version tag such as v0.2.0, or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.2.0 (created if it does not exist)'
        required: true

permissions:
  contents: write   # needed to create the release and upload the zip

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (needs .NET 10 Desktop Runtime on the PC)
        run: dotnet publish src/nSpectrum.App/nSpectrum.App.csproj -c Release -o out/nSpectrum -p:Version=${{ steps.ver.outputs.version }}

      - name: Publish self-contained (runs without installing .NET)
        run: dotnet publish src/nSpectrum.App/nSpectrum.App.csproj -c Release -o out/nSpectrum-standalone -p:Version=${{ steps.ver.outputs.version }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Zip
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Compress-Archive -Path out/nSpectrum/* -DestinationPath "nSpectrum-$v-win-x64.zip"
          Compress-Archive -Path out/nSpectrum-standalone/* -DestinationPath "nSpectrum-$v-win-x64-standalone.zip"

      - name: Create the GitHub release (or add the zips to an existing one)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $v = '${{ steps.ver.outputs.version }}'
          $files = @("nSpectrum-$v-win-x64.zip", "nSpectrum-$v-win-x64-standalone.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Made by hand on github.com first: just attach the zips (replacing any with the same name).
            gh release upload $tag @files --clobber
          } else {
            $options = @('--title', "nSpectrum $v", '--generate-notes', '--target', '${{ github.sha }}')
            if ($v -match '-') { $options += '--prerelease' }
            gh release create $tag @files @options
          }
